server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API -> DBKeeper (raft followers answer 307 to the leader)
    location /api/ {
        proxy_pass http://db-keeper-1:18110/;
        proxy_set_header Host $host;
    }
}
