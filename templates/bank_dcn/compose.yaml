name: bank_dcn

x-mysql-common: &mysql-common
  image: mysql:8.0
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
    interval: 2s
    timeout: 3s
    retries: 30

x-app-health: &app-health
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
    interval: 3s
    timeout: 3s
    retries: 40

services:
  # ============ DMZ: internet-facing proxy only, no business logic ============
  traefik:
    # Since v3.6 the embedded Docker client supports API version auto-negotiation; v3.1 pins 1.24,
    # which is rejected by Docker Engine >= 29 daemons (minimum API 1.40+).
    image: traefik:v3.6
    container_name: dcn-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=dcn-sf
      - --entrypoints.web.address=:80
      - --api.insecure=true
      - --metrics.prometheus=true
      - --entrypoints.metrics.address=:8082
      - --metrics.prometheus.entrypoint=metrics
    ports:
      - "18070:80"    # unified entrypoint
      - "18071:8080"  # dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [dmz, sf]
    labels:
      prometheus.scrape: "true"
      prometheus.port: "8082"

  # ============ SF (ServerFarm): shared services + middleware ============
  gns-redis:
    image: redis:7-alpine
    container_name: gns-redis
    restart: unless-stopped
    ports: ["16379:6379"]
    networks: [sf]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  dcn-rabbitmq:
    image: rabbitmq:3.13-management
    container_name: dcn-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: dcn
      RABBITMQ_DEFAULT_PASS: dcn123
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./deploy/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports: ["15672:15672"]
    networks: [sf]
    labels:
      prometheus.scrape: "true"
      prometheus.port: "15692"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30

  gns:
    <<: *app-health
    container_name: gns
    build:
      context: .
      dockerfile: gns/Dockerfile
    environment:
      DB_DSN: root:${MYSQL_ROOT_PASSWORD:-dcn123}@tcp(db-proxy:23310)/gns_db?parseTime=true
      REDIS_ADDR: gns-redis:6379
    ports: ["18080:8080"]
    networks: [sf]
    labels:
      traefik.enable: "true"
      traefik.http.routers.gns.rule: PathPrefix(`/gns`)
      traefik.http.routers.gns.entrypoints: web
      traefik.http.routers.gns.middlewares: gns-strip
      traefik.http.middlewares.gns-strip.stripprefix.prefixes: /gns
      traefik.http.services.gns.loadbalancer.server.port: "8080"
      prometheus.scrape: "true"
      prometheus.port: "8080"
    depends_on:
      gns-db:
        condition: service_healthy
      gns-redis:
        condition: service_healthy

  rmb-coordinator:
    <<: *app-health
    container_name: rmb-coordinator
    build:
      context: .
      dockerfile: rmb/Dockerfile
    environment:
      DB_DSN: root:${MYSQL_ROOT_PASSWORD:-dcn123}@tcp(db-proxy:23311)/rmb_db?parseTime=true
      AMQP_URL: amqp://dcn:dcn123@dcn-rabbitmq:5672/
      TX_TIMEOUT_SECONDS: "5"
    ports: ["18090:8080"]
    networks: [sf]
    labels:
      traefik.enable: "true"
      traefik.http.routers.rmb.rule: PathPrefix(`/rmb`)
      traefik.http.routers.rmb.entrypoints: web
      traefik.http.routers.rmb.middlewares: rmb-strip
      traefik.http.middlewares.rmb-strip.stripprefix.prefixes: /rmb
      traefik.http.services.rmb.loadbalancer.server.port: "8080"
      prometheus.scrape: "true"
      prometheus.port: "8080"
    depends_on:
      db-proxy:
        condition: service_healthy
      dcn-rabbitmq:
        condition: service_healthy

  adm:
    <<: *app-health
    container_name: adm
    build:
      context: .
      dockerfile: adm/Dockerfile
    environment:
      DB_DSN: root:${MYSQL_ROOT_PASSWORD:-dcn123}@tcp(db-proxy:23312)/adm_db?parseTime=true
      AMQP_URL: amqp://dcn:dcn123@dcn-rabbitmq:5672/
      GNS_ENDPOINT: http://gns:8080
    ports: ["18091:8080"]
    networks: [sf]
    labels:
      traefik.enable: "true"
      traefik.http.routers.adm.rule: PathPrefix(`/adm`)
      traefik.http.routers.adm.entrypoints: web
      traefik.http.routers.adm.middlewares: adm-strip
      traefik.http.middlewares.adm-strip.stripprefix.prefixes: /adm
      traefik.http.services.adm.loadbalancer.server.port: "8080"
      prometheus.scrape: "true"
      prometheus.port: "8080"
    depends_on:
      db-proxy:
        condition: service_healthy
      dcn-rabbitmq:
        condition: service_healthy
      gns:
        condition: service_started

  batch-scheduler:
    <<: *app-health
    container_name: batch-scheduler
    build:
      context: .
      dockerfile: batch-scheduler/Dockerfile
    environment:
      DB_DSN: root:${MYSQL_ROOT_PASSWORD:-dcn123}@tcp(db-proxy:23313)/batch_db?parseTime=true
      GNS_ENDPOINT: http://gns:8080
    ports: ["18092:8080"]
    networks: [sf]
    labels:
      traefik.enable: "true"
      traefik.http.routers.batch.rule: PathPrefix(`/batch`)
      traefik.http.routers.batch.entrypoints: web
      traefik.http.routers.batch.middlewares: batch-strip
      traefik.http.middlewares.batch-strip.stripprefix.prefixes: /batch
      traefik.http.services.batch.loadbalancer.server.port: "8080"
      prometheus.scrape: "true"
      prometheus.port: "8080"
    depends_on:
      batch-db:
        condition: service_healthy
      gns:
        condition: service_started

  # ============ CORE: databases only ============
  gns-db:
    <<: *mysql-common
    container_name: gns-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dcn123}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: gns_db
    volumes:
      - ./gns/db/init:/docker-entrypoint-initdb.d:ro
      - gns-db-data:/var/lib/mysql
    ports: ["13309:3306"]
    networks: [core]

  rmb-db:
    <<: *mysql-common
    container_name: rmb-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dcn123}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: rmb_db
    volumes:
      - ./rmb/db/init:/docker-entrypoint-initdb.d:ro
      - rmb-db-data:/var/lib/mysql
    ports: ["13310:3306"]
    networks: [core]

  adm-db:
    <<: *mysql-common
    container_name: adm-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dcn123}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: adm_db
    volumes:
      - ./adm/db/init:/docker-entrypoint-initdb.d:ro
      - adm-db-data:/var/lib/mysql
    ports: ["13311:3306"]
    networks: [core]

  batch-db:
    <<: *mysql-common
    container_name: batch-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dcn123}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: batch_db
    volumes:
      - ./batch-scheduler/db/init:/docker-entrypoint-initdb.d:ro
      - batch-db-data:/var/lib/mysql
    ports: ["13313:3306"]
    networks: [core]

  # ============ IDC 1 (idc1): dcn01 + dcn03 primary databases ============
  dcn01-db:
    <<: *mysql-common
    container_name: dcn01-db
    # Self-managed replication set (with dcn01-db-replica below): binlog +
    # GTID so DBKeeper can orchestrate primary switches; other unit DBs stay
    # plain single instances like the RDS simulation.
    command:
      - --server-id=1
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-bin=binlog
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dcn123}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: dcn01_db
    volumes:
      - ./dcn-app/db/init:/docker-entrypoint-initdb.d:ro
      - dcn01-db-data:/var/lib/mysql
    ports: ["13306:3306"]
    networks: [idc1-db]

  dcn03-db:
    <<: *mysql-common
    container_name: dcn03-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dcn123}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: dcn03_db
    volumes:
      - ./dcn-app/db/init:/docker-entrypoint-initdb.d:ro
      - dcn03-db-data:/var/lib/mysql
    ports: ["13308:3306"]
    networks: [idc1-db]

  dcn01-app:
    <<: *app-health
    container_name: dcn01-app
    build:
      context: .
      dockerfile: dcn-app/Dockerfile
    environment:
      DCN_ID: dcn01
      DB_DSN: root:${MYSQL_ROOT_PASSWORD:-dcn123}@tcp(db-proxy:23301)/dcn01_db?parseTime=true
      GNS_ENDPOINT: http://gns:8080
      RMB_ENDPOINT: http://rmb-coordinator:8080
      AMQP_URL: amqp://dcn:dcn123@dcn-rabbitmq:5672/
      RATE_LIMIT_RPS: "200"
      INTEREST_DAILY_RATE: ${INTEREST_DAILY_RATE:-0.0001}
    ports: ["18081:8080"]
    networks: [idc1, sf]
    labels:
      traefik.enable: "true"
      traefik.http.routers.dcn.rule: PathPrefix(`/dcn`)
      traefik.http.routers.dcn.entrypoints: web
      traefik.http.routers.dcn.middlewares: dcn-strip
      traefik.http.middlewares.dcn-strip.stripprefix.prefixes: /dcn
      traefik.http.services.dcn.loadbalancer.server.port: "8080"
      prometheus.scrape: "true"
      prometheus.port: "8080"
    depends_on:
      dcn01-db:
        condition: service_healthy
      db-proxy:
        condition: service_healthy
      dcn-rabbitmq:
        condition: service_healthy
      gns:
        condition: service_started
      rmb-coordinator:
        condition: service_started

  dcn03-app:
    <<: *app-health
    container_name: dcn03-app
    build:
      context: .
      dockerfile: dcn-app/Dockerfile
    environment:
      DCN_ID: dcn03
      DB_DSN: root:${MYSQL_ROOT_PASSWORD:-dcn123}@tcp(db-proxy:23303)/dcn03_db?parseTime=true
      GNS_ENDPOINT: http://gns:8080
      RMB_ENDPOINT: http://rmb-coordinator:8080
      AMQP_URL: amqp://dcn:dcn123@dcn-rabbitmq:5672/
      RATE_LIMIT_RPS: "200"
      INTEREST_DAILY_RATE: ${INTEREST_DAILY_RATE:-0.0001}
    ports: ["18083:8080"]
    networks: [idc1, sf]
    labels:
      traefik.enable: "true"
      traefik.http.routers.dcn.rule: PathPrefix(`/dcn`)
      traefik.http.routers.dcn.entrypoints: web
      traefik.http.routers.dcn.middlewares: dcn-strip
      traefik.http.middlewares.dcn-strip.stripprefix.prefixes: /dcn
      traefik.http.services.dcn.loadbalancer.server.port: "8080"
      prometheus.scrape: "true"
      prometheus.port: "8080"
    depends_on:
      db-proxy:
        condition: service_healthy
      dcn-rabbitmq:
        condition: service_healthy
      gns:
        condition: service_started
      rmb-coordinator:
        condition: service_started

  # ============ IDC 2 (idc2): dcn02 primary database ============
  dcn02-db:
    <<: *mysql-common
    container_name: dcn02-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dcn123}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: dcn02_db
    volumes:
      - ./dcn-app/db/init:/docker-entrypoint-initdb.d:ro
      - dcn02-db-data:/var/lib/mysql
    ports: ["13307:3306"]
    networks: [idc2-db]

  dcn02-app:
    <<: *app-health
    container_name: dcn02-app
    build:
      context: .
      dockerfile: dcn-app/Dockerfile
    environment:
      DCN_ID: dcn02
      DB_DSN: root:${MYSQL_ROOT_PASSWORD:-dcn123}@tcp(db-proxy:23302)/dcn02_db?parseTime=true
      GNS_ENDPOINT: http://gns:8080
      RMB_ENDPOINT: http://rmb-coordinator:8080
      AMQP_URL: amqp://dcn:dcn123@dcn-rabbitmq:5672/
      RATE_LIMIT_RPS: "200"
      INTEREST_DAILY_RATE: ${INTEREST_DAILY_RATE:-0.0001}
    ports: ["18082:8080"]
    networks: [idc2, sf]
    labels:
      traefik.enable: "true"
      traefik.http.routers.dcn.rule: PathPrefix(`/dcn`)
      traefik.http.routers.dcn.entrypoints: web
      traefik.http.routers.dcn.middlewares: dcn-strip
      traefik.http.middlewares.dcn-strip.stripprefix.prefixes: /dcn
      traefik.http.services.dcn.loadbalancer.server.port: "8080"
      prometheus.scrape: "true"
      prometheus.port: "8080"
    depends_on:
      db-proxy:
        condition: service_healthy
      dcn-rabbitmq:
        condition: service_healthy
      gns:
        condition: service_started
      rmb-coordinator:
        condition: service_started

  # ============ DB layer control plane (self-managed MySQL set demo) ============
  dcn01-db-replica:
    <<: *mysql-common
    container_name: dcn01-db-replica
    # Starts read-only; DBKeeper runs CHANGE REPLICATION SOURCE and flips
    # read-only on promote. No init SQL: data arrives via replication.
    command:
      - --server-id=11
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-bin=binlog
      - --read-only=ON
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dcn123}
      MYSQL_ROOT_HOST: "%"
    volumes:
      - dcn01-db-replica-data:/var/lib/mysql
    networks: [idc1-db]

  db-keeper-1:
    restart: unless-stopped
    container_name: db-keeper-1
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18110/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40
    build:
      context: .
      dockerfile: db-keeper/Dockerfile
    environment: &keeper-env
      NODE_ID: db-keeper-1
      RAFT_ADDR: db-keeper-1:18111
      PEERS: db-keeper-1:18111,db-keeper-2:18111,db-keeper-3:18111
      SETS: "dcn01:23301:dcn01-db:3306,dcn01-db-replica:3306;dcn02:23302:dcn02-db:3306;dcn03:23303:dcn03-db:3306;dcn04:23304:dcn04-db:3306;gns:23310:gns-db:3306;rmb:23311:rmb-db:3306;adm:23312:adm-db:3306;batch:23313:batch-db:3306"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dcn123}
      PROXIES: http://db-proxy:18120,http://db-proxy-2:18122
    ports: ["18110:18110"]
    networks: [mgmt, idc1-db, idc2-db, core]
    labels:
      prometheus.scrape: "true"
      prometheus.port: "18110"

  db-keeper-2:
    restart: unless-stopped
    container_name: db-keeper-2
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18110/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40
    build:
      context: .
      dockerfile: db-keeper/Dockerfile
    environment:
      <<: *keeper-env
      NODE_ID: db-keeper-2
      RAFT_ADDR: db-keeper-2:18111
    networks: [mgmt, idc1-db, idc2-db, core]
    labels:
      prometheus.scrape: "true"
      prometheus.port: "18110"

  db-keeper-3:
    restart: unless-stopped
    container_name: db-keeper-3
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18110/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40
    build:
      context: .
      dockerfile: db-keeper/Dockerfile
    environment:
      <<: *keeper-env
      NODE_ID: db-keeper-3
      RAFT_ADDR: db-keeper-3:18111
    networks: [mgmt, idc1-db, idc2-db, core]
    labels:
      prometheus.scrape: "true"
      prometheus.port: "18110"

  db-proxy:
    restart: unless-stopped
    container_name: db-proxy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18120/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40
    build:
      context: .
      dockerfile: db-proxy/Dockerfile
    environment:
      PROXY_ADMIN_ADDR: ":18120"
    ports: ["18120:18120"]
    networks: [sf, idc1-db, idc2-db, core, mgmt]
    labels:
      prometheus.scrape: "true"
      prometheus.port: "18120"

  # Second proxy instance receives the same routing pushes (stateless L4);
  # a production HA pair also needs a VIP/DNS fronting both.
  db-proxy-2:
    restart: unless-stopped
    container_name: db-proxy-2
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:18122/healthz"]
      interval: 3s
      timeout: 3s
      retries: 40
    build:
      context: .
      dockerfile: db-proxy/Dockerfile
    environment:
      PROXY_ADMIN_ADDR: ":18122"
    ports: ["18122:18122"]
    networks: [sf, idc1-db, idc2-db, core, mgmt]

  db-admin:
    container_name: db-admin
    build:
      context: .
      dockerfile: db-admin/Dockerfile
    restart: unless-stopped
    ports: ["18130:80"]
    networks: [mgmt]
    depends_on:
      db-keeper-1:
        condition: service_started

  # ============ Expansion unit (profile: expansion, not started by default) ============
  dcn04-db:
    <<: *mysql-common
    container_name: dcn04-db
    profiles: [expansion]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dcn123}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: dcn04_db
    volumes:
      - ./dcn-app/db/init:/docker-entrypoint-initdb.d:ro
      - dcn04-db-data:/var/lib/mysql
    ports: ["13312:3306"]
    networks: [idc2-db]

  dcn04-app:
    <<: *app-health
    container_name: dcn04-app
    profiles: [expansion]
    build:
      context: .
      dockerfile: dcn-app/Dockerfile
    environment:
      DCN_ID: dcn04
      DB_DSN: root:${MYSQL_ROOT_PASSWORD:-dcn123}@tcp(db-proxy:23304)/dcn04_db?parseTime=true
      GNS_ENDPOINT: http://gns:8080
      RMB_ENDPOINT: http://rmb-coordinator:8080
      AMQP_URL: amqp://dcn:dcn123@dcn-rabbitmq:5672/
      RATE_LIMIT_RPS: "200"
      INTEREST_DAILY_RATE: ${INTEREST_DAILY_RATE:-0.0001}
    ports: ["18084:8080"]
    networks: [idc2, sf]
    labels:
      traefik.enable: "true"
      traefik.http.routers.dcn.rule: PathPrefix(`/dcn`)
      traefik.http.routers.dcn.entrypoints: web
      traefik.http.routers.dcn.middlewares: dcn-strip
      traefik.http.middlewares.dcn-strip.stripprefix.prefixes: /dcn
      traefik.http.services.dcn.loadbalancer.server.port: "8080"
      prometheus.scrape: "true"
      prometheus.port: "8080"
    depends_on:
      db-proxy:
        condition: service_healthy
      dcn-rabbitmq:
        condition: service_healthy
      gns:
        condition: service_started
      rmb-coordinator:
        condition: service_started

  # ============ MGMT: observability and ops ============
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: dcn-prometheus
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - prometheus-data:/prometheus
    ports: ["19090:9090"]
    # Scrapes SF targets directly; per-IDC and CORE targets are reached through
    # the exporters below (MGMT crosses zones, firewall-equivalent in production).
    networks: [mgmt, sf]

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: mysqld-exporter
    restart: unless-stopped
    command:
      - --config.my-cnf=/cfg/my.cnf
    volumes:
      - ./deploy/mysql-exporter/my.cnf:/cfg/my.cnf:ro
    # Probes span every database location: dcn01/03-db on idc1, dcn02/04-db on
    # idc2, gns/rmb/adm/batch-db on core.
    networks: [mgmt, idc1-db, idc2-db, core]

  redis-exporter:
    image: oliver006/redis_exporter:v1.63.0
    container_name: redis-exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: redis://gns-redis:6379
    networks: [mgmt, sf]
    labels:
      prometheus.scrape: "true"
      prometheus.port: "9121"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: dcn-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["13000:3000"]
    networks: [mgmt]
    depends_on:
      - prometheus

  console:
    <<: *app-health
    container_name: console
    build:
      context: .
      dockerfile: console/Dockerfile
    environment:
      PROMETHEUS_URL: http://prometheus:9090
      DOCKER_SOCKET: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports: ["18099:8080"]
    networks: [mgmt]
    depends_on:
      prometheus:
        condition: service_started
    labels:
      prometheus.scrape: "true"
      prometheus.port: "8080"

# Physical security zones (dmz/sf/core/mgmt, WeBank-style) x IDC fault
# domains (idc1/idc2 for the app tier, idc1-db/idc2-db for DB placement).
# Zones govern security, IDCs govern blast radius. Applications NEVER join
# a DB network: they reach MySQL only through db-proxy (port-per-set).
networks:
  dmz:
    name: dcn-dmz
  sf:
    name: dcn-sf
  core:
    name: dcn-core
  mgmt:
    name: dcn-mgmt
  idc1:
    name: dcn-idc1
  idc2:
    name: dcn-idc2
  idc1-db:
    name: dcn-idc1-db
  idc2-db:
    name: dcn-idc2-db

volumes:
  gns-db-data:
  rmb-db-data:
  adm-db-data:
  batch-db-data:
  rabbitmq-data:
  dcn01-db-data:
  dcn01-db-replica-data:
  dcn02-db-data:
  dcn03-db-data:
  dcn04-db-data:
  prometheus-data:
  grafana-data:
