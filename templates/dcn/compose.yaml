name: dcn

x-mysql-common: &mysql-common
  image: mysql:8.0
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
    interval: 2s
    timeout: 3s
    retries: 30

x-app-health: &app-health
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
    interval: 3s
    timeout: 3s
    retries: 40

services:
  # ============ 全局区（global-net） ============
  gns-db:
    <<: *mysql-common
    container_name: gns-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dcn123}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: gns_db
    volumes:
      - ./db/init/gns:/docker-entrypoint-initdb.d:ro
      - gns-db-data:/var/lib/mysql
    ports: ["13309:3306"]
    networks: [global-net]

  gns-redis:
    image: redis:7-alpine
    container_name: gns-redis
    restart: unless-stopped
    ports: ["16379:6379"]
    networks: [global-net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  dcn-rabbitmq:
    image: rabbitmq:3.13-management
    container_name: dcn-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: dcn
      RABBITMQ_DEFAULT_PASS: dcn123
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports: ["15672:15672"]
    networks: [global-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30

  rmb-db:
    <<: *mysql-common
    container_name: rmb-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dcn123}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: rmb_db
    volumes:
      - ./db/init/rmb:/docker-entrypoint-initdb.d:ro
      - rmb-db-data:/var/lib/mysql
    ports: ["13310:3306"]
    networks: [global-net]

  adm-db:
    <<: *mysql-common
    container_name: adm-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dcn123}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: adm_db
    volumes:
      - ./db/init/adm:/docker-entrypoint-initdb.d:ro
      - adm-db-data:/var/lib/mysql
    ports: ["13311:3306"]
    networks: [global-net]

  gns:
    <<: *app-health
    container_name: gns
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: gns }
    environment:
      DB_DSN: root:${MYSQL_ROOT_PASSWORD:-dcn123}@tcp(gns-db:3306)/gns_db?parseTime=true
      REDIS_ADDR: gns-redis:6379
    ports: ["18080:8080"]
    networks: [global-net]
    labels:
      traefik.enable: "true"
      traefik.http.routers.gns.rule: PathPrefix(`/gns`)
      traefik.http.routers.gns.entrypoints: web
      traefik.http.routers.gns.middlewares: gns-strip
      traefik.http.middlewares.gns-strip.stripprefix.prefixes: /gns
      traefik.http.services.gns.loadbalancer.server.port: "8080"
    depends_on:
      gns-db:
        condition: service_healthy
      gns-redis:
        condition: service_healthy

  rmb-coordinator:
    <<: *app-health
    container_name: rmb-coordinator
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: rmb-coordinator }
    environment:
      DB_DSN: root:${MYSQL_ROOT_PASSWORD:-dcn123}@tcp(rmb-db:3306)/rmb_db?parseTime=true
      AMQP_URL: amqp://dcn:dcn123@dcn-rabbitmq:5672/
      TX_TIMEOUT_SECONDS: "5"
    ports: ["18090:8080"]
    networks: [global-net]
    labels:
      traefik.enable: "true"
      traefik.http.routers.rmb.rule: PathPrefix(`/rmb`)
      traefik.http.routers.rmb.entrypoints: web
      traefik.http.routers.rmb.middlewares: rmb-strip
      traefik.http.middlewares.rmb-strip.stripprefix.prefixes: /rmb
      traefik.http.services.rmb.loadbalancer.server.port: "8080"
    depends_on:
      rmb-db:
        condition: service_healthy
      dcn-rabbitmq:
        condition: service_healthy

  adm:
    <<: *app-health
    container_name: adm
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: adm }
    environment:
      DB_DSN: root:${MYSQL_ROOT_PASSWORD:-dcn123}@tcp(adm-db:3306)/adm_db?parseTime=true
      AMQP_URL: amqp://dcn:dcn123@dcn-rabbitmq:5672/
      GNS_ENDPOINT: http://gns:8080
    ports: ["18091:8080"]
    networks: [global-net]
    labels:
      traefik.enable: "true"
      traefik.http.routers.adm.rule: PathPrefix(`/adm`)
      traefik.http.routers.adm.entrypoints: web
      traefik.http.routers.adm.middlewares: adm-strip
      traefik.http.middlewares.adm-strip.stripprefix.prefixes: /adm
      traefik.http.services.adm.loadbalancer.server.port: "8080"
    depends_on:
      adm-db:
        condition: service_healthy
      dcn-rabbitmq:
        condition: service_healthy
      gns:
        condition: service_started

  batch-db:
    <<: *mysql-common
    container_name: batch-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dcn123}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: batch_db
    volumes:
      - ./db/init/batch:/docker-entrypoint-initdb.d:ro
      - batch-db-data:/var/lib/mysql
    ports: ["13313:3306"]
    networks: [global-net]

  batch-scheduler:
    <<: *app-health
    container_name: batch-scheduler
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: batch-scheduler }
    environment:
      DB_DSN: root:${MYSQL_ROOT_PASSWORD:-dcn123}@tcp(batch-db:3306)/batch_db?parseTime=true
      GNS_ENDPOINT: http://gns:8080
    ports: ["18092:8080"]
    networks: [global-net]
    labels:
      traefik.enable: "true"
      traefik.http.routers.batch.rule: PathPrefix(`/batch`)
      traefik.http.routers.batch.entrypoints: web
      traefik.http.routers.batch.middlewares: batch-strip
      traefik.http.middlewares.batch-strip.stripprefix.prefixes: /batch
      traefik.http.services.batch.loadbalancer.server.port: "8080"
    depends_on:
      batch-db:
        condition: service_healthy
      gns:
        condition: service_started

  traefik:
    image: traefik:v3.1
    container_name: dcn-traefik
    restart: unless-stopped
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=dcn-global
      - --entrypoints.web.address=:80
      - --api.insecure=true
    ports:
      - "18070:80"    # 统一入口
      - "18071:8080"  # dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [global-net]

  # ============ IDC 1（idc1）：dcn01 + dcn03 主库 ============
  dcn01-db:
    <<: *mysql-common
    container_name: dcn01-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dcn123}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: dcn01_db
    volumes:
      - ./db/init/dcn:/docker-entrypoint-initdb.d:ro
      - dcn01-db-data:/var/lib/mysql
    ports: ["13306:3306"]
    networks: [idc1]

  dcn03-db:
    <<: *mysql-common
    container_name: dcn03-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dcn123}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: dcn03_db
    volumes:
      - ./db/init/dcn:/docker-entrypoint-initdb.d:ro
      - dcn03-db-data:/var/lib/mysql
    ports: ["13308:3306"]
    networks: [idc1]

  dcn01-app:
    <<: *app-health
    container_name: dcn01-app
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: dcn-app }
    environment:
      DCN_ID: dcn01
      DB_DSN: root:${MYSQL_ROOT_PASSWORD:-dcn123}@tcp(dcn01-db:3306)/dcn01_db?parseTime=true
      GNS_ENDPOINT: http://gns:8080
      RMB_ENDPOINT: http://rmb-coordinator:8080
      AMQP_URL: amqp://dcn:dcn123@dcn-rabbitmq:5672/
      RATE_LIMIT_RPS: "200"
    ports: ["18081:8080"]
    networks: [idc1, global-net]
    labels:
      traefik.enable: "true"
      traefik.http.routers.dcn.rule: PathPrefix(`/dcn`)
      traefik.http.routers.dcn.entrypoints: web
      traefik.http.routers.dcn.middlewares: dcn-strip
      traefik.http.middlewares.dcn-strip.stripprefix.prefixes: /dcn
      traefik.http.services.dcn.loadbalancer.server.port: "8080"
    depends_on:
      dcn01-db:
        condition: service_healthy
      dcn-rabbitmq:
        condition: service_healthy
      gns:
        condition: service_started
      rmb-coordinator:
        condition: service_started

  dcn03-app:
    <<: *app-health
    container_name: dcn03-app
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: dcn-app }
    environment:
      DCN_ID: dcn03
      DB_DSN: root:${MYSQL_ROOT_PASSWORD:-dcn123}@tcp(dcn03-db:3306)/dcn03_db?parseTime=true
      GNS_ENDPOINT: http://gns:8080
      RMB_ENDPOINT: http://rmb-coordinator:8080
      AMQP_URL: amqp://dcn:dcn123@dcn-rabbitmq:5672/
      RATE_LIMIT_RPS: "200"
    ports: ["18083:8080"]
    networks: [idc1, global-net]
    labels:
      traefik.enable: "true"
      traefik.http.routers.dcn.rule: PathPrefix(`/dcn`)
      traefik.http.routers.dcn.entrypoints: web
      traefik.http.routers.dcn.middlewares: dcn-strip
      traefik.http.middlewares.dcn-strip.stripprefix.prefixes: /dcn
      traefik.http.services.dcn.loadbalancer.server.port: "8080"
    depends_on:
      dcn03-db:
        condition: service_healthy
      dcn-rabbitmq:
        condition: service_healthy
      gns:
        condition: service_started
      rmb-coordinator:
        condition: service_started

  # ============ IDC 2（idc2）：dcn02 主库 ============
  dcn02-db:
    <<: *mysql-common
    container_name: dcn02-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dcn123}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: dcn02_db
    volumes:
      - ./db/init/dcn:/docker-entrypoint-initdb.d:ro
      - dcn02-db-data:/var/lib/mysql
    ports: ["13307:3306"]
    networks: [idc2]

  dcn02-app:
    <<: *app-health
    container_name: dcn02-app
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: dcn-app }
    environment:
      DCN_ID: dcn02
      DB_DSN: root:${MYSQL_ROOT_PASSWORD:-dcn123}@tcp(dcn02-db:3306)/dcn02_db?parseTime=true
      GNS_ENDPOINT: http://gns:8080
      RMB_ENDPOINT: http://rmb-coordinator:8080
      AMQP_URL: amqp://dcn:dcn123@dcn-rabbitmq:5672/
      RATE_LIMIT_RPS: "200"
    ports: ["18082:8080"]
    networks: [idc2, global-net]
    labels:
      traefik.enable: "true"
      traefik.http.routers.dcn.rule: PathPrefix(`/dcn`)
      traefik.http.routers.dcn.entrypoints: web
      traefik.http.routers.dcn.middlewares: dcn-strip
      traefik.http.middlewares.dcn-strip.stripprefix.prefixes: /dcn
      traefik.http.services.dcn.loadbalancer.server.port: "8080"
    depends_on:
      dcn02-db:
        condition: service_healthy
      dcn-rabbitmq:
        condition: service_healthy
      gns:
        condition: service_started
      rmb-coordinator:
        condition: service_started

  # ============ 扩容单元（profile: expansion，默认不启动） ============
  dcn04-db:
    <<: *mysql-common
    container_name: dcn04-db
    profiles: [expansion]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-dcn123}
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: dcn04_db
    volumes:
      - ./db/init/dcn:/docker-entrypoint-initdb.d:ro
      - dcn04-db-data:/var/lib/mysql
    ports: ["13312:3306"]
    networks: [idc2]

  dcn04-app:
    <<: *app-health
    container_name: dcn04-app
    profiles: [expansion]
    build:
      context: .
      dockerfile: Dockerfile
      args: { SERVICE: dcn-app }
    environment:
      DCN_ID: dcn04
      DB_DSN: root:${MYSQL_ROOT_PASSWORD:-dcn123}@tcp(dcn04-db:3306)/dcn04_db?parseTime=true
      GNS_ENDPOINT: http://gns:8080
      RMB_ENDPOINT: http://rmb-coordinator:8080
      AMQP_URL: amqp://dcn:dcn123@dcn-rabbitmq:5672/
      RATE_LIMIT_RPS: "200"
    ports: ["18084:8080"]
    networks: [idc2, global-net]
    labels:
      traefik.enable: "true"
      traefik.http.routers.dcn.rule: PathPrefix(`/dcn`)
      traefik.http.routers.dcn.entrypoints: web
      traefik.http.routers.dcn.middlewares: dcn-strip
      traefik.http.middlewares.dcn-strip.stripprefix.prefixes: /dcn
      traefik.http.services.dcn.loadbalancer.server.port: "8080"
    depends_on:
      dcn04-db:
        condition: service_healthy
      dcn-rabbitmq:
        condition: service_healthy
      gns:
        condition: service_started
      rmb-coordinator:
        condition: service_started

networks:
  idc1:
    name: dcn-idc1
  idc2:
    name: dcn-idc2
  global-net:
    name: dcn-global

volumes:
  gns-db-data:
  rmb-db-data:
  adm-db-data:
  batch-db-data:
  rabbitmq-data:
  dcn01-db-data:
  dcn02-db-data:
  dcn03-db-data:
  dcn04-db-data:
