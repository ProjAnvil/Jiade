# Production secret contract.
#
# This is a CONTRACT, not a credential store: it specifies the shape of the
# secret material the bank services expect, to be provisioned by the platform
# secrets manager via the secrets-store-csi-driver. No credential values are
# committed — the fields below carry only object NAME keys and placeholder
# provider parameters that the operator must wire to their managed-secret
# identifiers before applying.
#
# The SecretProviderClass asks the CSI driver to materialise a Kubernetes
# Secret named `bank-prod-secrets` with the three keys the Deployments consume
# via envFrom (see the patches in kustomization.yaml):
#
#   DB_PASSWORD         — PostgreSQL password for the seven bank roles. In a
#                         per-database-credential deployment, split this into
#                         seven SecretProviderClass secretObjects and adjust
#                         the Deployment env patches to reference per-service
#                         Secrets.
#   BROKER_URL          — RabbitMQ URL (amqp:// or amqps://) with credentials.
#   BANK_OPERATOR_TOKEN — constant-time token compared by the
#                         WorkflowAdminService on payment's admin gRPC port.
#
# The example below uses the Azure Key Vault provider; set `provider` and
# `parameters` to match your platform (aws, gcp, vault, etc.). The
# SecretProviderClass API is stable (secrets-store-csi.x-k8s.io/v1) and does
# not embed any secret values — only references.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: bank-prod-secrets
spec:
  provider: azure
  # secretObjects tells the CSI driver to project the mounted secret material
  # into a Kubernetes Secret that the Deployments can consume via envFrom.
  secretObjects:
    - secretName: bank-prod-secrets
      type: Opaque
      data:
        - objectName: bank-proc/db-password
          key: DB_PASSWORD
        - objectName: bank-proc/broker-url
          key: BROKER_URL
        - objectName: bank-proc/operator-token
          key: BANK_OPERATOR_TOKEN
  parameters:
    usePodIdentity: "true"
    keyvaultName: "<set-me>"        # operator: set to the managed vault name
    tenantId: "<set-me>"            # operator: set to the AAD tenant id
    objects: |
      array:
        - |
          objectName: bank-proc/db-password
          objectType: secret
        - |
          objectName: bank-proc/broker-url
          objectType: secret
        - |
          objectName: bank-proc/operator-token
          objectType: secret
