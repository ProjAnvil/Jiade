# Production external-state Services.
#
# Each Service is type: ExternalName and resolves to a managed platform
# equivalent (managed PostgreSQL, managed RabbitMQ). The DNS names are
# configurable via the bank-external-endpoints ConfigMap and the Kustomize
# replacements declared in kustomization.yaml — editing those literals rewrites
# every externalName at build time.
#
# These Services replace the dev overlay's StatefulSets: the application
# Deployments keep DB_HOST=core-banking-db (etc.) and BROKER_URL=...@rabbitmq,
# and these ExternalName Services make those names resolve to the managed
# endpoints. Because ExternalName Services return a CNAME, the application's
# own DB_PORT/BROKER_URL port selection drives the actual connection.

# ===================== PostgreSQL: seven ExternalName Services =====================

---
apiVersion: v1
kind: Service
metadata:
  name: core-banking-db
spec:
  type: ExternalName
  externalName: core-banking-db.example.internal
  ports:
    - {name: postgres, port: 5432}
