# Dev-only credentials for the bank services.
#
# These literals are intentionally readable: they let `kubectl apply -k
# deploy/k8s/overlays/dev` come up with a runnable topology without an external
# secrets manager. The `bank.jiade/unsafe: dev-only` label marks every key as
# non-production so policy tools can flag any leak into a prod render.
#
# Production overlays must NOT replicate this file — they use a
# SecretProviderClass contract (see overlays/prod/secret-contract.yaml) that
# references an external secrets manager and carries no credential values.
#
# Keys consumed by the application via envFrom (see kustomization.yaml patches):
#   DB_PASSWORD         — PostgreSQL password; matches POSTGRES_PASSWORD on the
#                         dev StatefulSets and the compose default.
#   BROKER_URL          — RabbitMQ URL; hostname `rabbitmq` resolves to the dev
#                         StatefulSet Service (or the prod ExternalName).
#   BANK_OPERATOR_TOKEN — constant-time token compared by the
#                         WorkflowAdminService on payment's admin gRPC port.
apiVersion: v1
kind: Secret
metadata:
  name: bank-dev-secrets
  labels: {bank.jiade/unsafe: dev-only}
type: Opaque
stringData:
  DB_PASSWORD: bank
  BROKER_URL: amqp://bank:bank@rabbitmq:5672/
  BANK_OPERATOR_TOKEN: dev-operator-token
