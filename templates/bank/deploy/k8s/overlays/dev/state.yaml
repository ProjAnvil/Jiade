# ===================== RabbitMQ =====================
# Single-broker StatefulSet matching the compose `rabbitmq` service. The
# management UI port (15672) is exposed only inside the cluster.
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  labels: {app: rabbitmq, bank.jiade/unsafe: dev-only}
spec:
  clusterIP: None
  selector: {app: rabbitmq}
  ports:
    - {name: amqp, port: 5672, targetPort: amqp}
    - {name: management, port: 15672, targetPort: management}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels: {app: rabbitmq, bank.jiade/unsafe: dev-only}
spec:
  serviceName: rabbitmq
  replicas: 1
  selector: {matchLabels: {app: rabbitmq}}
  template:
    metadata:
      labels: {app: rabbitmq, bank.jiade/unsafe: dev-only}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: rabbitmq
          image: rabbitmq:4.0-management
          ports:
            - {name: amqp, containerPort: 5672}
            - {name: management, containerPort: 15672}
          env:
            - {name: RABBITMQ_DEFAULT_USER, value: bank}
            - {name: RABBITMQ_DEFAULT_PASS, value: bank}
            - {name: RABBITMQ_DEFAULT_VHOST, value: "/"}
          readinessProbe:
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec: {command: [rabbitmq-diagnostics, -q, ping]}
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts: [{name: data, mountPath: /var/lib/rabbitmq}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 768Mi}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}

# ===================== Data-plane ingress NetworkPolicies =====================
# The base network-policy.yaml default-denies all ingress; these two policies
# open the data ports required by the in-cluster StatefulSets above. They are
# dev-only because the prod overlay has no in-cluster PostgreSQL/RabbitMQ pods
# (ExternalName routes to managed services), so the ingress selectors match
# nothing in production and would be dead weight there.

# Allow the seven app pods to reach their PostgreSQL databases on :5432.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgres-ingress
  labels: {bank.jiade/unsafe: dev-only}
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [core-banking-db, customer-db, payment-db, reward-db, risk-db, loan-db, wealth-db]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [core-banking, customer, payment, reward, risk, loan, wealth]
      ports:
        - {protocol: TCP, port: 5432}

# Allow the seven app pods to reach RabbitMQ on :5672 (AMQP).
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-rabbitmq-ingress
  labels: {bank.jiade/unsafe: dev-only}
spec:
  podSelector:
    matchLabels: {app: rabbitmq}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [core-banking, customer, payment, reward, risk, loan, wealth]
      ports:
        - {protocol: TCP, port: 5672}
