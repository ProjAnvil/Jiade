# Dev-only stateful dependencies: seven PostgreSQL StatefulSets and one
# RabbitMQ StatefulSet, each with a headless Service for stable DNS and a PVC
# for durability across pod restarts.
#
# Together with secret.yaml this overlay makes `kubectl apply -k
# deploy/k8s/overlays/dev` runnable end-to-end: every bank service can resolve
# its DB_HOST and BROKER_URL inside the cluster. Production overlays do NOT use
# StatefulSets — they ExternalName-resolve to managed equivalents.
#
# The service names (core-banking-db, customer-db, ..., rabbitmq) match the
# DB_HOST / BROKER_URL values hard-coded in the base Deployments, so the
# application code is identical between overlays.
#
# Every resource here carries `bank.jiade/unsafe: dev-only` to make the
# non-production intent grep-able and to allow policy tools to flag any
# dev-only object that leaks into a production render.

# ===================== PostgreSQL: seven databases =====================
# One StatefulSet per bank service, matching the compose volumes
# pg-core-banking, pg-customer, pg-payment, pg-reward, pg-risk, pg-loan,
# pg-wealth. POSTGRES_DB matches the DB_NAME env set on each base Deployment.

# ---------- core-banking-db ----------
apiVersion: v1
kind: Service
metadata:
  name: core-banking-db
  labels: {app: core-banking-db, bank.jiade/unsafe: dev-only}
spec:
  clusterIP: None
  selector: {app: core-banking-db}
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: core-banking-db
  labels: {app: core-banking-db, bank.jiade/unsafe: dev-only}
spec:
  serviceName: core-banking-db
  replicas: 1
  selector: {matchLabels: {app: core-banking-db}}
  template:
    metadata:
      labels: {app: core-banking-db, bank.jiade/unsafe: dev-only}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:16-bookworm
          ports: [{name: postgres, containerPort: 5432}]
          env:
            - {name: POSTGRES_USER, value: bank}
            - {name: POSTGRES_PASSWORD, value: bank}
            - {name: POSTGRES_DB, value: core_db}
          readinessProbe:
            exec: {command: [sh, -c, "pg_isready -U bank -d $POSTGRES_DB"]}
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: {command: [sh, -c, "pg_isready -U bank -d $POSTGRES_DB"]}
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 1Gi}}

