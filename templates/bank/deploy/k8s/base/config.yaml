# Shared, non-secret application defaults for every bank service.
#
# This ConfigMap carries ONLY non-secret defaults. Per-service values
# (DB_HOST, DB_NAME, gRPC targets) are set directly on each Deployment, and
# production secrets (DB_PASSWORD, broker credentials) MUST be injected by an
# overlay via a Secret — never committed here.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bank-config
data:
  # HTTP / gRPC listen addresses (container ports 8080 / 9090).
  HTTP_ADDR: ":8080"
  GRPC_ADDR: ":9090"

  # PostgreSQL connection defaults (non-secret). Host and database name are
  # per-service and set on each Deployment.
  DB_PORT: "5432"
  DB_USER: bank
  DB_SSLMODE: disable
  DB_MAX_CONNS: "10"
  DB_MIN_CONNS: "1"

  # Inter-service gRPC client timeouts.
  CLIENT_REQUEST_TIMEOUT: 8s
  CLIENT_ATTEMPT_TIMEOUT: 3s

  # Transactional outbox defaults.
  OUTBOX_BATCH_SIZE: "100"
  OUTBOX_POLL_INTERVAL: 1s

  # Graceful shutdown budget; must stay below the pod termination grace period.
  SHUTDOWN_TIMEOUT: 25s
